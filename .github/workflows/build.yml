name: Build installers

# Builds native installers for Windows, Linux and macOS.
#
# Every successful build PUBLISHES the installers on the public GitHub
# Releases page, where anyone can download them without logging in:
#   - push to main     -> rolling "latest" release, updated at every push
#   - push of tag v*   -> versioned release (e.g. v0.1.0) that ALSO carries
#                         the signed updater artifacts (.sig files, macOS
#                         .app.tar.gz) and latest.json, the index the app
#                         downloads ONLY when the user asks for updates
#                         (releases/latest skips prereleases, so updates
#                         come from v* tags only, never from main).
# Windows produces exactly ONE installer: the .msi. Published assets use
# stable file names (no version numbers) so the README can link them
# directly: https://github.com/<repo>/releases/download/latest/<asset>.
# The files are also kept as workflow artifacts (Actions tab, login needed).
# Every matrix job additionally uploads the NOT-installed release binary
# as a separate portable workflow artifact (latex-editor-portable-*):
# download, run, zero installation — the installed version stays intact.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target-bundles: "msi"
            artifact-name: latex-editor-windows
            portable-name: latex-editor-portable-windows
          - os: ubuntu-22.04
            target-bundles: "deb,appimage"
            artifact-name: latex-editor-linux
            portable-name: latex-editor-portable-linux
          - os: macos-latest
            # "app" esplicito: garantisce il .app in bundle/macos sia per
            # l'artefatto portatile (zippato con ditto) sia per l'updater
            # (.app.tar.gz firmato, aggiunto in MU.1/MU.2).
            target-bundles: "app,dmg"
            artifact-name: latex-editor-macos
            portable-name: latex-editor-portable-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22: the test script runs the .ts test files directly with
          # `node --test --experimental-strip-types` (type stripping needs
          # Node >= 22.6 and the test runner's glob arguments need >= 21,
          # so Node 18/20 cannot run them).
          node-version: 22

      # B0.5.1 — la versione vive in un solo posto: src-tauri/tauri.conf.json.
      # Lo script sincronizza i file derivati (no-op se già coerenti) e il
      # git diff finale fallisce se il repository è stato committato fuori
      # sync: dopo un bump di versione serve `node scripts/sync-version.mjs`
      # seguito dal commit del risultato.
      - name: Sync version from tauri.conf.json and verify coherence
        shell: bash
        run: |
          node scripts/sync-version.mjs
          if ! git diff --quiet -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock; then
            echo "::error::I file della versione divergono da src-tauri/tauri.conf.json: esegui 'node scripts/sync-version.mjs' e committa il risultato."
            git --no-pager diff -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock
            exit 1
          fi

      # MU.2 — la configurazione updater dev'essere completa PRIMA di
      # buildare, formato della pubkey minisign incluso: con il segnaposto
      # REPLACE_WITH_MAINTAINER_PUBKEY il job FALLISCE di proposito (meglio
      # rosso in CI che un updater che non verifica le firme a casa
      # dell'utente).
      - name: Validate updater config (pubkey minisign)
        shell: bash
        run: node scripts/check-updater-config.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Typecheck and build frontend
        run: npm run build

      # The CI must run the discriminant tests of every fix phase, not just
      # typecheck+build: a red test has to redden the build on all three OSes.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust lints (clippy, warnings as errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Frontend tests
        run: npm test

      # MU.2 — mai buildare artifact updater senza chiave di firma:
      # createUpdaterArtifacts è attivo e la firma avviene durante
      # `npm run tauri build`, quindi i secret vanno esportati PRIMA.
      # Se la chiave manca il job FALLISCE con messaggio esplicito (una
      # password vuota è legittima per chiavi minisign senza password).
      - name: Export updater signing secrets (fail if missing)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY non è configurato: senza chiave di firma non si possono produrre artifact updater firmati, e artifact non firmati non si pubblicano MAI."
            exit 1
          fi
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<TAURI_SIGNING_EOF"
            echo "$TAURI_SIGNING_PRIVATE_KEY"
            echo "TAURI_SIGNING_EOF"
          } >> "$GITHUB_ENV"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<TAURI_SIGNING_PASSWORD_EOF"
            echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            echo "TAURI_SIGNING_PASSWORD_EOF"
          } >> "$GITHUB_ENV"

      # M0.6.5.2 — cache degli strumenti di bundling del tauri bundler.
      # package-lock.json fissa @tauri-apps/cli 2.12.4, che incorpora
      # tauri-bundler 2.10.4: senza cache OGNI build riscarica dalla rete
      # linuxdeploy e AppRun (Linux) e WiX (Windows), e un disservimento
      # GitHub — il 504 della run #17 — basta a rendere rossa la CI.
      # Percorsi letti sul codice del bundler in uso: dirs::cache_dir()/tauri,
      # cioè ~/.cache/tauri su Linux (AppRun-<arch>, linuxdeploy-*.AppImage e
      # plugin) e %LOCALAPPDATA%\tauri su Windows (WixTools314\; NSIS\ se un
      # domani venisse attivato). La chiave -vN si bumpa quando una versione
      # diversa del bundler cambia nomi o hash degli strumenti scaricati.
      # macOS non scarica nulla per il bundling (app e dmg nativi, script
      # incorporato nel bundler): nessuna cache lì.
      - name: Cache bundler tools (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-bundler-tools-${{ matrix.os }}-v1

      - name: Cache bundler tools (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-bundler-tools-${{ matrix.os }}-v1

      - name: Build app bundles
        run: npm run tauri build -- --bundles ${{ matrix.target-bundles }}

      - name: Verify bundle artifacts exist
        shell: bash
        run: |
          echo "Bundle output:"
          ls -R src-tauri/target/release/bundle || true
          test -d src-tauri/target/release/bundle

      # MU.2 — gli artifact updater firmati devono esserci TUTTI per ogni
      # piattaforma della matrice: se un .sig manca il job FALLISCE (meglio
      # rosso che un updater che dà errore a casa dell'utente).
      - name: Verify signed updater artifacts exist
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest)
              test -n "$(ls src-tauri/target/release/bundle/msi/*.msi.sig 2>/dev/null)"
              ;;
            ubuntu-22.04)
              test -n "$(ls src-tauri/target/release/bundle/appimage/*.AppImage.sig 2>/dev/null)"
              ;;
            macos-latest)
              test -n "$(ls src-tauri/target/release/bundle/macos/*.app.tar.gz 2>/dev/null)"
              test -n "$(ls src-tauri/target/release/bundle/macos/*.app.tar.gz.sig 2>/dev/null)"
              ;;
          esac
          echo "Firme updater generate:"
          ls -l src-tauri/target/release/bundle/*/*.sig

      # B0.5.2 — binario release NON installato come artefatto separato: chi
      # vuole provare l'app scarica l'artefatto dalla scheda Actions e lo
      # esegue direttamente, senza installazione e senza toccare l'eventuale
      # versione già installata. I test/ls qui sotto falliscono se il file
      # manca: meglio rosso che un artefatto portatile vuoto.
      - name: Stage and verify portable binaries
        shell: bash
        run: |
          mkdir -p portable-stage
          case "${{ matrix.os }}" in
            windows-latest)
              test -f src-tauri/target/release/latex-editor-offline.exe
              cp src-tauri/target/release/latex-editor-offline.exe portable-stage/
              ;;
            ubuntu-22.04)
              test -f src-tauri/target/release/latex-editor-offline
              cp src-tauri/target/release/latex-editor-offline portable-stage/
              ;;
            macos-latest)
              test -d "src-tauri/target/release/bundle/macos/LaTeX Editor Offline.app"
              ditto -c -k --keepParent \
                "src-tauri/target/release/bundle/macos/LaTeX Editor Offline.app" \
                portable-stage/LaTeX-Editor-Offline-macos-portable.zip
              ;;
          esac
          echo "Portable artifact content:"
          ls -l portable-stage

      - name: Upload portable binaries (workflow artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.portable-name }}
          if-no-files-found: error
          path: portable-stage/*

      - name: Upload installers and signed updater artifacts (workflow artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  release:
    name: Publish installers to GitHub Releases
    needs: build
    # Runs only after ALL three builds succeeded, on push to main or on v* tags.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release
      cancel-in-progress: true
    steps:
      # MU.2 — sul rilascio versionato servono gli script di generazione di
      # latest.json: checkout e Node PRIMA del download degli artifact
      # (il checkout ripulisce il workspace e cancellerebbe i file scaricati).
      - name: Checkout repository (release scripts)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v4

      - name: Set up Node.js (release scripts)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect installer files (stable names)
        shell: bash
        run: |
          mkdir -p assets
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # MU.2 — rilascio versionato: anche gli artifact updater firmati
            # (.sig) e l'app macOS .app.tar.gz (l'updater NON usa il .dmg).
            find dist -type f \
              \( -name '*.msi' -o -name '*.msi.sig' -o -name '*.deb' \
              -o -name '*.AppImage' -o -name '*.AppImage.sig' -o -name '*.dmg' \
              -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -exec cp {} assets/ \;
          else
            find dist -type f \
              \( -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) -exec cp {} assets/ \;
          fi
          cd assets
          # Publish under stable names (no version numbers) so the README and
          # the manual can link each file directly and the link never breaks
          # when the version changes: releases/download/latest/<name>.
          for f in *.msi;      do [ -e "$f" ] && mv "$f" LaTeX-Editor-Offline-windows-x64.msi;   done
          for f in *.deb;      do [ -e "$f" ] && mv "$f" LaTeX-Editor-Offline-linux-amd64.deb;     done
          for f in *.AppImage; do [ -e "$f" ] && mv "$f" LaTeX-Editor-Offline-linux-amd64.AppImage; done
          for f in *.dmg; do
            [ -e "$f" ] || continue
            case "$f" in
              *aarch64*) mv "$f" LaTeX-Editor-Offline-macos-aarch64.dmg ;;
              *x86_64*)  mv "$f" LaTeX-Editor-Offline-macos-x64.dmg ;;
              *)         mv "$f" LaTeX-Editor-Offline-macos.dmg ;;
            esac
          done
          # MU.2 — anche firme e artifact updater, affiancati ai rispettivi
          # file con nomi stabili.
          for f in *.msi.sig; do [ -e "$f" ] && mv "$f" LaTeX-Editor-Offline-windows-x64.msi.sig; done
          for f in *.AppImage.sig; do [ -e "$f" ] && mv "$f" LaTeX-Editor-Offline-linux-amd64.AppImage.sig; done
          for f in *.app.tar.gz; do
            [ -e "$f" ] || continue
            case "$f" in
              *aarch64*) mv "$f" LaTeX-Editor-Offline-macos-aarch64.app.tar.gz ;;
              *x86_64*)  mv "$f" LaTeX-Editor-Offline-macos-x64.app.tar.gz ;;
              *)         mv "$f" LaTeX-Editor-Offline-macos.app.tar.gz ;;
            esac
          done
          for f in *.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            case "$f" in
              *aarch64*) mv "$f" LaTeX-Editor-Offline-macos-aarch64.app.tar.gz.sig ;;
              *x86_64*)  mv "$f" LaTeX-Editor-Offline-macos-x64.app.tar.gz.sig ;;
              *)         mv "$f" LaTeX-Editor-Offline-macos.app.tar.gz.sig ;;
            esac
          done
          cd ..
          echo "Files to publish:"
          ls -l assets
          test -n "$(ls -A assets)"
          # MU.2 — completezza degli asset updater nel rilascio versionato:
          # se manca una piattaforma o una firma il job FALLISCE subito.
          # (La matrice compila macOS solo su Apple Silicon: se un domani
          # cambia, aggiornare questo elenco e UPDATER_PLATFORMS.)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            for f in \
              LaTeX-Editor-Offline-windows-x64.msi \
              LaTeX-Editor-Offline-windows-x64.msi.sig \
              LaTeX-Editor-Offline-linux-amd64.AppImage \
              LaTeX-Editor-Offline-linux-amd64.AppImage.sig \
              LaTeX-Editor-Offline-macos-aarch64.app.tar.gz \
              LaTeX-Editor-Offline-macos-aarch64.app.tar.gz.sig
            do
              test -f "assets/$f" || { echo "::error::Asset updater mancante nel rilascio: $f"; exit 1; }
            done
          fi

      - name: Extract release notes from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:body)' > tag-notes.txt
          # Tag leggero o senza messaggio: titolo di default, mai un campo vuoto.
          if [ ! -s tag-notes.txt ]; then
            printf 'Rilascio %s' "$GITHUB_REF_NAME" > tag-notes.txt
          fi

      # MU.2 — latest.json per l'updater: la generazione stessa VALIDA (se
      # una piattaforma manca, o una firma manca/è vuota, o il tag non è
      # semver, il job FALLISCE) e il --check riverifica il file scritto.
      - name: Generate and validate latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node scripts/make-latest.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --assets-dir assets \
            --notes-file tag-notes.txt \
            --out assets/latest.json
          node scripts/make-latest.mjs --check assets/latest.json
          echo "latest.json da pubblicare:"
          cat assets/latest.json

      - name: Prepare release notes
        if: github.ref == 'refs/heads/main'
        run: |
          cat > body.md <<'EOF'
          **Build automatico** dell'ultimo commit su `main` — questo rilascio
          viene aggiornato a ogni push. Su Windows è disponibile **un unico
          installer**: il file `.msi`.

          | Sistema | File | Come installare |
          |---|---|---|
          | **Windows 10/11** | `LaTeX-Editor-Offline-windows-x64.msi` | Doppio clic. Se SmartScreen avvisa: «Ulteriori informazioni» → «Esegui comunque» |
          | **Linux (Ubuntu/Debian)** | `LaTeX-Editor-Offline-linux-amd64.deb` | `sudo dpkg -i ./*.deb` oppure doppio clic → «Installa» |
          | **Linux (altre distribuzioni)** | `LaTeX-Editor-Offline-linux-amd64.AppImage` | `chmod +x ./*.AppImage` poi doppio clic |
          | **macOS (Apple Silicon)** | `LaTeX-Editor-Offline-macos-aarch64.dmg` | Apri il .dmg e trascina l'app in *Applicazioni*. Primo avvio: clic destro → «Apri» |

          > I **link diretti** a questi file (sempre aggiornati) sono nel README
          > del repository, sezione «Scarica l'app».
          >
          > Per compilare i documenti serve un compilatore LaTeX già installato
          > sul sistema: **MiKTeX** (Windows) · **TeX Live** (Linux) ·
          > **MacTeX** (macOS). L'app lo rileva automaticamente all'avvio.
          EOF

      - name: Delete previous "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Scarica qui — build automatico (main)"
          prerelease: true
          body_path: body.md
          fail_on_unmatched_files: true
          files: assets/*

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "LaTeX Editor Offline ${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: assets/*
