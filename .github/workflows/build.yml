name: build

# Produce gli eseguibili per Windows, Linux e macOS:
# - manualmente (workflow_dispatch) → artefatti scaricabili dalla run;
# - sui tag v* → bozza di Release con tutti gli installer allegati.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  desktop:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        # Per un binario Intel su macOS aggiungi "macos-13" alla lista,
        # oppure costruisci localmente con --target universal-apple-darwin.

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installa le dipendenze di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Installa le dipendenze npm
        run: npm ci

      - name: Compila l'applicazione
        run: npm run tauri build

      - name: Comprimi il bundle .app (macOS)
        if: runner.os == 'macOS'
        run: zip -r "latex-editor-offline-${{ runner.arch }}.app.zip" "src-tauri/target/release/bundle/macos/LaTeX Editor Offline.app"

      - name: Carica gli artefatti
        uses: actions/upload-artifact@v4
        with:
          name: latex-editor-offline-${{ runner.os }}-${{ runner.arch }}
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/appimage/*
            src-tauri/target/release/bundle/deb/*
            src-tauri/target/release/bundle/rpm/*
            src-tauri/target/release/bundle/dmg/*
            *.app.zip
          if-no-files-found: warn

      - name: Crea la bozza di Release (solo sui tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            *.app.zip
