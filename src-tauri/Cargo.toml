[package]
name = "latex-editor-offline"
version = "0.1.0"
description = "Offline-first LaTeX desktop editor"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "latex-editor-offline"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
regex = "1"
once_cell = "1"

[profile.release]
strip = true
lto = false
codegen-units = 16
