[package]
name = "latex-editor-offline"
version = "0.3.0"
description = "Offline-first LaTeX desktop editor"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "latex-editor-offline"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
regex = "1"
once_cell = "1"
# Atomic writes (temp file in the same directory + fsync + rename).
# MIT OR Apache-2.0 — allowed dependency.
tempfile = "3"
# Deletion to the system trash instead of permanent removal.
# MIT — allowed dependency.
trash = "5"
# Updater opt-in: artifact firmati minisign. L'app tocca la rete SOLO
# sull'azione esplicita dell'utente («Controlla aggiornamenti»), mai
# all'avvio. MIT OR Apache-2.0 — dipendenza ammessa (MU.1).
tauri-plugin-updater = "2"
# Riavvio dell'app dopo l'installazione di un aggiornamento. La UI lo usa
# solo alla fine del flusso esplicito di update. MIT OR Apache-2.0 —
# dipendenza ammessa (MU.1).
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = false
codegen-units = 16
