[package]
name = "latex-editor-offline"
version = "0.1.0"
description = "Original, fully offline LaTeX editor built with Tauri 2"
authors = ["LaTeX Editor Offline contributors"]
edition = "2021"
license = "MIT"
repository = ""
default-run = "latex-editor-offline"

[lib]
name = "latex_editor_offline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
which = "6"
regex = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
